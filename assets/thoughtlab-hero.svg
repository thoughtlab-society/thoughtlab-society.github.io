<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 720" role="img" aria-label="Abstract scientific illustration of orbital paths, a glowing central particle and wave interference">
<defs>
 <radialGradient id="bg"><stop stop-color="#1a2b4d"/><stop offset="1" stop-color="#080d1b"/></radialGradient>
 <radialGradient id="core"><stop stop-color="#fff2d2"/><stop offset=".12" stop-color="#e6c5ff"/><stop offset=".4" stop-color="#8c78df" stop-opacity=".6"/><stop offset="1" stop-color="#8c78df" stop-opacity="0"/></radialGradient>
 <linearGradient id="orbit" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f4d9ad" stop-opacity=".05"/><stop offset=".5" stop-color="#b8a2ff" stop-opacity=".8"/><stop offset="1" stop-color="#80c9ef" stop-opacity=".12"/></linearGradient>
 <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#91b8ef" stop-opacity="0"/><stop offset=".5" stop-color="#d4b6ff" stop-opacity=".8"/><stop offset="1" stop-color="#91b8ef" stop-opacity="0"/></linearGradient>
 <filter id="glow"><feGaussianBlur stdDeviation="18"/></filter>
 <filter id="soft"><feGaussianBlur stdDeviation="4"/></filter>
</defs>
<rect width="1000" height="720" rx="28" fill="url(#bg)"/>
<circle cx="510" cy="330" r="260" fill="url(#core)" opacity=".36" filter="url(#glow)"/>
<!-- fine star field -->
<g fill="#e8ddff">
 <circle cx="95" cy="104" r="2" opacity=".6"/><circle cx="180" cy="210" r="1.5" opacity=".55"/><circle cx="830" cy="110" r="2" opacity=".65"/><circle cx="905" cy="250" r="1.4" opacity=".5"/><circle cx="115" cy="540" r="1.8" opacity=".5"/><circle cx="790" cy="590" r="2" opacity=".55"/><circle cx="665" cy="80" r="1.4" opacity=".6"/><circle cx="350" cy="620" r="1.5" opacity=".5"/><circle cx="930" cy="490" r="1.6" opacity=".55"/>
</g>
<!-- orbital paths -->
<g fill="none" stroke="url(#orbit)" stroke-width="2">
 <ellipse cx="510" cy="330" rx="345" ry="132" transform="rotate(-24 510 330)"/>
 <ellipse cx="510" cy="330" rx="345" ry="132" transform="rotate(38 510 330)"/>
 <ellipse cx="510" cy="330" rx="345" ry="132" transform="rotate(88 510 330)"/>
 <ellipse cx="510" cy="330" rx="275" ry="190" transform="rotate(-55 510 330)" stroke-opacity=".55"/>
</g>
<g fill="none" stroke="#cbb7ff" stroke-opacity=".23" stroke-width="1">
 <path d="M80 500 C230 410 300 420 440 500 S700 590 920 420"/>
 <path d="M65 530 C230 440 310 450 445 530 S710 620 940 450"/>
 <path d="M55 560 C225 470 320 480 450 560 S720 650 955 480"/>
</g>
<!-- central light -->
<circle cx="510" cy="330" r="115" fill="url(#core)"/>
<circle cx="510" cy="330" r="46" fill="#0c1327" stroke="#e8d5ff" stroke-opacity=".8" stroke-width="2"/>
<circle cx="510" cy="330" r="8" fill="#fff1d1"/>
<circle cx="510" cy="330" r="18" fill="#d9b9ff" opacity=".35" filter="url(#soft)"/>
<!-- wave fronts -->
<g fill="none" stroke="url(#wave)" stroke-width="2">
 <path d="M115 330 Q310 205 510 330 T905 330"/>
 <path d="M115 355 Q310 230 510 355 T905 355" opacity=".7"/>
 <path d="M115 380 Q310 255 510 380 T905 380" opacity=".45"/>
</g>
<!-- particles -->
<g fill="#e8d5ff">
 <circle cx="220" cy="245" r="5"/><circle cx="220" cy="245" r="13" opacity=".16" filter="url(#soft)"/>
 <circle cx="760" cy="220" r="4"/><circle cx="760" cy="220" r="12" opacity=".2" filter="url(#soft)"/>
 <circle cx="700" cy="510" r="4"/><circle cx="700" cy="510" r="12" opacity=".2" filter="url(#soft)"/>
</g>
<!-- editorial annotations -->
<g font-family="Arial,sans-serif" fill="#d9d2e8">
 <text x="70" y="78" font-size="14" letter-spacing="4" opacity=".8">THOUGHT LAB / PHYSICS IN MOTION</text>
 <text x="72" y="650" font-size="13" letter-spacing="3" opacity=".7">QUESTION  ·  EXPLORE  ·  UNDERSTAND</text>
 <text x="740" y="630" font-size="12" letter-spacing="2" opacity=".55">ORBITAL DYNAMICS</text>
</g>
<g stroke="#c9b5ec" stroke-opacity=".55" stroke-width="1">
 <path d="M220 245 L150 180 L95 180"/><path d="M760 220 L835 155 L900 155"/>
</g>
</svg>